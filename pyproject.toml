[project]
name = "taller-reparatrack"
version = "0.1.0"
description = "Sistema de Trazabilidad de Soporte Técnico (TerabyteRS)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Puertas de calidad del plan §4.5: cobertura con ramas y umbral del 80 %.
addopts = "-ra --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
# Hace que `app` sea importable al correr `pytest` a secas (no solo `python -m pytest`).
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
# El seeder de demostración es una utilidad de desarrollo, no código de la app.
omit = ["app/db/seed_demo.py"]
